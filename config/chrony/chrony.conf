# ==============================================================================
# Конфигурация NTP-сервера Chrony
# @file chrony.conf
# @brief Основная конфигурация сервиса синхронизации времени
# @author Радченко Д. (drad@sfedu.ru)
# @date 2026-06-06
# @version 1.0.0
# @license GNU GPLv3 <https://gnu.org>
# ==============================================================================

# Внешние источники времени (Stratum 1/2 пулы)
pool time.google.com iburst
pool time.cloudflare.com iburst
pool pool.ntp.org iburst

# Контроль доступа (только локальные подсети)
allow 172.16.0.0/12
allow 10.0.0.0/8
allow 192.168.0.0/16
deny 0.0.0.0/0

# Компенсация дрейфа часов
driftfile /var/lib/chrony/drift

# Режим изоляции (Local Stratum)
local stratum 10

# Параметры синхронизации
maxupdateskew 100.0

# Разрешить команды управления
cmdallow all
