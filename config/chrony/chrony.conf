# Настройка Chrony (NTP-сервер)
# Автор: Дмитрий Радченко
# Дата: 2026-06-06

# --- Откуда берется время ---
# Подключаемся к публичным серверам точного времени
# iburst — ускоряет первую синхронизацию (чтобы не ждать долго)
# maxsources 4 — опрашиваем не больше 4 серверов из каждого пула
pool time.cloudflare.com iburst maxsources 4
pool pool.ntp.org iburst maxsources 4

# --- Хранение поправок ---
# Chrony запоминает, насколько наши часы спешат/отстают
# и сохраняет это в файл, чтобы после перезагрузки не начинать с нуля
driftfile /var/lib/chrony/drift

# --- Кто может подключаться ---
# Разрешаем синхронизировать время только компьютерам из нашей локальной сети
allow 172.16.0.0/12
allow 10.0.0.0/8
allow 192.168.0.0/16

# Всем остальным (из интернета) — доступ запрещён
deny all

# --- Если интернет пропал --- 
# раздавать время (своё собственное) с низким приоритетом (stratum 10)
local stratum 10

# --- Журнал событий ---
# Папка, где будут храниться логи
logdir /var/log/chrony
# Записываем в лог: замеры времени, статистику и информацию о синхронизации
log measurements statistics tracking

# --- Сетевые настройки ---
# Слушаем запросы на всех сетевых интерфейсах (на всех IP-адресах)
bindaddress 0.0.0.0

# Команды управления (chronyc) принимаем только с localhost (127.0.0.1)
# Это безопаснее — никто извне не сможет поменять настройки
bindcmdaddress 127.0.0.1
bindcmdaddress ::1

# Стандартный порт для NTP — 123 (UDP)
clientport 123

# --- Проверка подлинности ---
# Файл с ключами для проверки, что пакеты действительно от наших серверов
# (защита от подделки времени)
keyfile /run/chrony/keys
# Требуем, чтобы источники времени были аутентифицированы
require sources

# --- Фильтрация ---
# Если сервер присылает время, которое отличается больше чем на 100 мс,
# считаем его ненадёжным и игнорируем
maxupdateskew 100.0
# Если задержка до сервера больше 16 секунд — тоже игнорируем (слишком медленно)
maxdistance 16.0

















