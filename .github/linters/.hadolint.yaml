---
# Конфигурация линтера Hadolint для проверки Dockerfile
# Игнорируемые правила (опционально для учебных проектов)
ignored:
  - DL3008  # Разрешаем apt-get install без фиксации версий пакетов
  - DL3018  # Разрешаем apk add без фиксации версий для базовых утилит

# Доверенные реестры образов
trustedRegistries:
  - docker.io
  - ghcr.io

# Контроль серьезности нарушений
severity:
  DL3000: error   # Ошибка валидации структуры Dockerfile
  DL3002: error   # Запрет переключения на root пользователя в конце сборки
  DL3006: warning # Базовый образ не имеет явного тега версии
  DL3020: error   # Использовать COPY вместо ADD
